name: Security

# Static analysis (CodeQL, as in the backend), dependency, filesystem and secret scanning. CodeQL
# results go to the repository's code scanning alerts; Trivy prints to the job log.

on:
  pull_request:
  push:
    branches: [main, testing, dev]
  schedule:
    # Weekly, so newly disclosed advisories against unchanged dependencies are still caught.
    - cron: '23 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'

  dependency-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      # Blocking gate on critical advisories; high/moderate are reported without failing, as in
      # the backend (many come from the Expo/React Native toolchain and need an SDK upgrade).
      - name: npm audit (critical, blocking)
        run: npm audit --audit-level=critical

      - name: npm audit (high/moderate, report only)
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=high

  filesystem-scan:
    name: Filesystem + secret scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (vulnerabilities + secrets)
        # Pinned to the commit, not the movable tag.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
