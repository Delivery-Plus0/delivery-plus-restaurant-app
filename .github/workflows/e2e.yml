name: E2E (Maestro web)

on:
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        options: [smoke, business, all]
        default: all

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_REPOSITORY: ${{ vars.BACKEND_REPOSITORY || 'Yousefa7medmaher/delivery-plus' }}
  BACKEND_REF: ${{ vars.BACKEND_REF || 'dev' }}
  E2E_API_URL: http://localhost:3100
  E2E_MANIFEST: ${{ github.workspace }}/backend/e2e-seed-manifest.json
  SUITE: ${{ github.event_name == 'pull_request' && 'smoke' || inputs.suite || 'all' }}

jobs:
  maestro-web:
    name: Maestro web (${{ github.event_name == 'pull_request' && 'smoke' || inputs.suite || 'all' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPOSITORY }}
          ref: ${{ env.BACKEND_REF }}
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Start isolated backend
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run e2e:env:up

      - name: Seed QA accounts and orders
        working-directory: backend
        run: npm run seed:e2e
        env:
          API_URL: ${{ env.E2E_API_URL }}

      - name: Install app
        run: npm ci --no-audit --no-fund

      - name: Run restaurant UI suite
        run: node e2e/scripts/run.mjs --suite "$SUITE" --build --headless
        env:
          E2E_API_URL: ${{ env.E2E_API_URL }}
          E2E_MANIFEST: ${{ env.E2E_MANIFEST }}

      - name: Collect backend logs
        if: failure()
        working-directory: backend
        run: |
          mkdir -p ../e2e/.artifacts/backend
          docker compose -p delivery-plus-e2e -f docker-compose.base.yml -f docker-compose.test.yml -f docker-compose.e2e.yml ps > ../e2e/.artifacts/backend/compose-ps.txt || true
          docker compose -p delivery-plus-e2e -f docker-compose.base.yml -f docker-compose.test.yml -f docker-compose.e2e.yml logs --no-color --tail=300 > ../e2e/.artifacts/backend/compose-logs.txt || true

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: restaurant-e2e-${{ env.SUITE }}-${{ github.run_id }}
          path: e2e/.artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down isolated backend
        if: always()
        working-directory: backend
        run: npm run e2e:env:down