# Shared: start from a clean browser state and sign in as ${EMAIL} (the QA restaurant owner).
url: ${APP_URL}/login
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 20000
- tapOn:
    id: login-email
- inputText: ${EMAIL}
- tapOn:
    id: login-password
- inputText: ${PASSWORD}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: restaurant-heading
    timeout: 20000
# The QA owner also owns QA Night Cafe (closed); work on QA Kitchen (${RESTAURANT_ID}).
- runFlow:
    when:
      visible:
        id: restaurant-select-${RESTAURANT_ID}
    commands:
      - tapOn:
          id: restaurant-select-${RESTAURANT_ID}
- extendedWaitUntil:
    visible: 'QA Kitchen'
    timeout: 10000
