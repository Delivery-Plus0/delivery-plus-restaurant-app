url: ${APP_URL}
name: Change password - a wrong current password is refused without signing out; the new password signs in
tags:
  - smoke
---
# A fresh owner (password ${PASSWORD}, no restaurant yet), so the QA owner's password never changes.
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: password/new-account
- launchApp:
    clearState: true
- openLink: ${APP_URL}/login
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 20000
- tapOn:
    id: login-email
- inputText: ${output.control.newEmail}
- tapOn:
    id: login-password
- inputText: ${PASSWORD}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: change-password
    timeout: 20000
- tapOn:
    id: change-password
- extendedWaitUntil:
    visible:
      id: change-password-sheet
    timeout: 10000

# A wrong current password: refused on the sheet, and this device stays signed in (backend 400, not 401).
- tapOn:
    id: change-password-current
- inputText: not-the-password
- tapOn:
    id: change-password-new
- inputText: ${output.control.newPassword}
- tapOn:
    id: change-password-confirm
- inputText: ${output.control.newPassword}
- tapOn:
    id: change-password-submit
- extendedWaitUntil:
    visible:
      id: change-password-error
    timeout: 15000
- assertVisible: 'Your current password is wrong\..*'
- assertNotVisible:
    id: session-ended

# The right one changes it; the board says so.
- tapOn:
    id: change-password-current
- eraseText: 30
- inputText: ${PASSWORD}
- tapOn:
    id: change-password-submit
- extendedWaitUntil:
    visible:
      id: board-notice
    timeout: 15000
- assertVisible: 'Password changed\. Your other devices were signed out\.'

# Sign out; the new password signs in.
- tapOn:
    id: sign-out
- tapOn:
    id: sign-out-dialog-confirm
- extendedWaitUntil:
    visible:
      id: login-email
    timeout: 20000
- tapOn:
    id: login-email
- inputText: ${output.control.newEmail}
- tapOn:
    id: login-password
- inputText: ${output.control.newPassword}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: change-password
    timeout: 20000
