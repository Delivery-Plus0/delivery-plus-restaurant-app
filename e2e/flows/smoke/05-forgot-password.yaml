url: ${APP_URL}
name: Forgot password - a texted code sets a new password; a wrong code is refused
tags:
  - smoke
---
# A fresh owner with a verified phone (the code only goes to a verified phone).
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: password/new-account
- launchApp:
    clearState: true
- openLink: ${APP_URL}/login
- extendedWaitUntil:
    visible:
      id: login-forgot
    timeout: 20000
- tapOn:
    id: login-forgot
- extendedWaitUntil:
    visible:
      id: forgot-screen
    timeout: 10000

# Ask for a code (the test stack keeps it instead of texting it).
- tapOn:
    id: forgot-phone
- inputText: ${output.control.newPhone}
- tapOn:
    id: forgot-send
- extendedWaitUntil:
    visible:
      id: forgot-reset-screen
    timeout: 15000
- assertVisible: 'If \+20 12.* is the verified phone of an account, we texted it a 6-digit code\..*'
- assertVisible: 'Resend code in [0-9]+ s'
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: password/read-reset-code

# A wrong code is refused.
- tapOn:
    id: forgot-code
- inputText: ${output.control.wrongCode}
- tapOn:
    id: forgot-new-password
- inputText: ${output.control.newPassword}
- tapOn:
    id: forgot-confirm-password
- inputText: ${output.control.newPassword}
- tapOn:
    id: forgot-submit
- extendedWaitUntil:
    visible:
      id: forgot-error
    timeout: 15000
- assertVisible: '.*That code isn.t right\..*'

# The right code sets the new password, and sign-in says so.
- tapOn:
    id: forgot-code
- eraseText: 10
- inputText: ${output.control.code}
- tapOn:
    id: forgot-submit
- extendedWaitUntil:
    visible:
      id: login-notice
    timeout: 15000
- assertVisible: 'Password changed\. Sign in with your new password\.'
- tapOn:
    id: login-email
- inputText: ${output.control.newEmail}
- tapOn:
    id: login-password
- inputText: ${output.control.newPassword}
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible:
      id: change-password
    timeout: 20000
