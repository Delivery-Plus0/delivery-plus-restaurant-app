url: ${APP_URL}
name: A ready order waits for a driver, then is assigned once the driver goes online in the driver app
tags:
  - regression
  - cross-app
---
- runFlow: ../_shared/login.yaml
# No driver free: in the real driver app, the QA driver (the only driver in the E2E stack) goes
# offline. Then an order is placed and marked ready through the API (customer + restaurant
# stand-ins). Auto-dispatch creates the delivery, which waits.
- runFlow: ../_shared/driver-app-sign-in.yaml
- runFlow: ../_shared/driver-app-go-offline.yaml
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: scenario/order-ready
- openLink: ${APP_URL}/order/${output.control.orderId}
- extendedWaitUntil:
    visible:
      id: order-status
      text: Ready for pickup
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: delivery-stage
      text: Finding a driver
    timeout: 20000
- assertVisible: '.*QA Pasta'
# The driver goes online in the driver app; the auto-dispatch sweep (every 2 s on the E2E stack)
# assigns the waiting delivery, and the customer app picks it up on its next poll.
- openLink: ${DRIVER_APP_URL}/home
- extendedWaitUntil:
    visible:
      id: go-online
    timeout: 20000
- tapOn:
    id: go-online
- extendedWaitUntil:
    visible:
      id: current-delivery
    timeout: 30000
- openLink: ${APP_URL}/order/${output.control.orderId}
- extendedWaitUntil:
    visible:
      id: delivery-stage
      text: Driver assigned
    timeout: 40000
# Leave the QA driver free for the business flow: deliver it in the driver app.
- runFlow: ../_shared/driver-app-deliver.yaml
