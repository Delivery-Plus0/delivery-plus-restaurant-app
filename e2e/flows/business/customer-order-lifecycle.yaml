url: ${APP_URL}
name: Full cycle across both apps - customer orders, restaurant readies, automatic dispatch, the driver app delivers, customer sees Delivered
tags:
  - business
  - cross-app
---
# Two real UIs in one browser: the customer app (${APP_URL}) and the driver app (${DRIVER_APP_URL}).
# Only the restaurant is still an API stand-in (no restaurant client yet). Dispatch is the backend's
# own automatic dispatch; nothing in this flow creates or assigns a delivery.

# CUSTOMER APP: sign in first (login.yaml starts from a clean browser state).
- runFlow: ../_shared/login.yaml

# DRIVER APP: the QA driver signs in and is offline, so the order below has to wait for them.
- runFlow: ../_shared/driver-app-sign-in.yaml
- runFlow: ../_shared/driver-app-go-offline.yaml

# CUSTOMER APP (real UI): browse, cart, checkout.
- openLink: ${APP_URL}
- extendedWaitUntil:
    visible:
      id: home-title
    timeout: 20000
- runFlow: ../_shared/open-qa-kitchen.yaml
- tapOn:
    id: add-QA Burger
- extendedWaitUntil:
    visible:
      id: qty-QA Burger-value
    timeout: 15000
- tapOn:
    id: cart-bar
- extendedWaitUntil:
    visible:
      id: cart-checkout
    timeout: 15000
- tapOn:
    id: cart-checkout
- extendedWaitUntil:
    visible:
      id: checkout-place-order
    timeout: 15000
- tapOn:
    id: checkout-place-order
- extendedWaitUntil:
    visible:
      id: order-status
      text: Confirmed
    timeout: 20000

# RESTAURANT (stand-in: the runner acts as qa.restaurant through the real API).
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: restaurant/prepare
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: restaurant/ready

# AUTOMATIC DISPATCH: delivery-service consumed order.ready_for_pickup and created the delivery; with
# no driver online it waits.
- openLink: ${APP_URL}/order/${output.control.orderId}
- extendedWaitUntil:
    visible:
      id: delivery-stage
      text: Finding a driver
    timeout: 30000

# DRIVER APP: going online is what gets the order assigned; the app finds the job through
# GET /deliveries/me/current and starts sharing its location.
- openLink: ${DRIVER_APP_URL}/home
- extendedWaitUntil:
    visible:
      id: go-online
    timeout: 20000
- tapOn:
    id: go-online
- extendedWaitUntil:
    visible:
      id: current-delivery
    timeout: 30000
- assertVisible:
    id: driver-status
    text: On a delivery
- assertVisible:
    id: delivery-stage
    text: Go to the restaurant
- assertVisible: 'QA Kitchen'
- assertVisible: '1 Test Street, Apt 1'
- assertVisible: '.*QA Burger'
- extendedWaitUntil:
    visible:
      id: location-status
      text: Sharing your location with the customer
    timeout: 15000

# CUSTOMER APP: the driver is assigned. The customer app has no map yet (Phase 7), so the runner
# checks the customer's tracking endpoint (customer token) returns the position the driver app sent.
- openLink: ${APP_URL}/order/${output.control.orderId}
- extendedWaitUntil:
    visible:
      id: delivery-stage
      text: Driver assigned
    timeout: 30000
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: tracking/assert-location

# DRIVER APP: picked up.
- openLink: ${DRIVER_APP_URL}/home
- extendedWaitUntil:
    visible:
      id: delivery-action-pickup
    timeout: 20000
- tapOn:
    id: delivery-action-pickup
- extendedWaitUntil:
    visible:
      id: delivery-action-start
    timeout: 15000

# CUSTOMER APP: sees it.
- openLink: ${APP_URL}/order/${output.control.orderId}
- extendedWaitUntil:
    visible:
      id: delivery-stage
      text: Picked up
    timeout: 30000

# DRIVER APP: on the way.
- openLink: ${DRIVER_APP_URL}/home
- extendedWaitUntil:
    visible:
      id: delivery-action-start
    timeout: 20000
- tapOn:
    id: delivery-action-start
- extendedWaitUntil:
    visible:
      id: delivery-action-complete
    timeout: 15000

# CUSTOMER APP: sees it.
- openLink: ${APP_URL}/order/${output.control.orderId}
- extendedWaitUntil:
    visible:
      id: delivery-stage
      text: On the way
    timeout: 30000

# DRIVER APP: delivered; the driver is free and online again.
- openLink: ${DRIVER_APP_URL}/home
- extendedWaitUntil:
    visible:
      id: delivery-action-complete
    timeout: 20000
- tapOn:
    id: delivery-action-complete
- extendedWaitUntil:
    visible:
      id: waiting-for-job
    timeout: 20000
- assertVisible:
    id: driver-status
    text: 'Online · waiting for a job'

# CUSTOMER APP: order and delivery reach Delivered.
- openLink: ${APP_URL}/order/${output.control.orderId}
- extendedWaitUntil:
    visible:
      id: order-status
      text: Delivered
    timeout: 30000
- assertVisible:
    id: delivery-stage
    text: Delivered

# Server-side checks for this order: DELIVERED, exactly one delivery row, no new dead letters.
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: verify/order-integrity

# CUSTOMER APP: the confirmation notification is in Alerts.
- openLink: ${APP_URL}/notifications
- extendedWaitUntil:
    visible: '.*${output.control.orderId} has been confirmed\.'
    timeout: 20000
