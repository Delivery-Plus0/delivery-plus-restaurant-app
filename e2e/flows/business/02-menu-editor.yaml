url: ${APP_URL}
name: Menu editor - the owner adds a category and an item, edits the price, archives the item, deletes the empty category
tags:
  - business
---
# Fixture: nothing left over from an earlier, interrupted run. (Feedback alerts also hold their
# icon, so the flow waits for the alert by id and checks its sentence separately.)
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: menu/cleanup
- runFlow: ../_shared/login.yaml
- openLink: ${APP_URL}/menu
- extendedWaitUntil:
    visible:
      id: menu-add-category
    timeout: 20000

# A new category.
- tapOn:
    id: menu-add-category
- extendedWaitUntil:
    visible:
      id: category-editor
    timeout: 10000
- tapOn:
    id: category-editor-name
- inputText: E2E Desserts
- tapOn:
    id: category-editor-save
- extendedWaitUntil:
    visible:
      id: menu-feedback
    timeout: 15000
- assertVisible: 'Added the E2E Desserts category'
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: menu/find
- assertVisible:
    id: menu-section-${output.control.categoryId}-empty

# A new item in it; validation first (no price), then a real one.
- tapOn:
    id: category-${output.control.categoryId}-add-item
- extendedWaitUntil:
    visible:
      id: item-editor
    timeout: 10000
- tapOn:
    id: item-editor-name
- inputText: E2E Basbousa
- tapOn:
    id: item-editor-save
- assertVisible: 'Enter a price in EGP, e\.g\. 45 or 45\.50'
- tapOn:
    id: item-editor-price
- inputText: '35'
- tapOn:
    id: item-editor-save
- extendedWaitUntil:
    visible:
      id: menu-feedback
    timeout: 15000
- assertVisible: 'Added E2E Basbousa to the menu'
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: menu/find
- assertVisible:
    id: item-${output.control.itemId}

# Edit the price.
- tapOn:
    id: item-${output.control.itemId}-edit
- extendedWaitUntil:
    visible:
      id: item-editor-price
    timeout: 10000
- tapOn:
    id: item-editor-price
- eraseText: 10
- inputText: '40.50'
- tapOn:
    id: item-editor-save
- extendedWaitUntil:
    visible:
      id: menu-feedback
    timeout: 15000
- assertVisible: 'Saved E2E Basbousa'
- assertVisible: '.*40\.50'

# Photo (#149): none yet; one uploaded through the API (the picker can't be automated on web) shows
# in the editor, and the editor's Remove clears it.
- tapOn:
    id: item-${output.control.itemId}-edit
- extendedWaitUntil:
    visible:
      id: item-editor-photo-empty
    timeout: 10000
- assertVisible:
    id: item-editor-photo-pick
- assertVisible: 'Add photo'
- tapOn:
    id: item-editor-close
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: menu/upload-photo
# The upload happened behind the app's back, so reload the menu to see it (an upload from the
# editor reloads it by itself).
- openLink: ${APP_URL}/menu
- extendedWaitUntil:
    visible:
      id: item-${output.control.itemId}-edit
    timeout: 20000
- tapOn:
    id: item-${output.control.itemId}-edit
- extendedWaitUntil:
    visible:
      id: item-editor-photo-image
    timeout: 15000
- assertVisible:
    id: item-editor-photo-pick
- assertVisible: 'Replace photo'
- tapOn:
    id: item-editor-photo-remove
- extendedWaitUntil:
    visible:
      id: item-editor-photo-empty
    timeout: 15000
- tapOn:
    id: item-editor-close

# Archive it, behind a confirmation: it leaves the menu.
- tapOn:
    id: item-${output.control.itemId}-edit
- extendedWaitUntil:
    visible:
      id: item-editor-archive
    timeout: 10000
- tapOn:
    id: item-editor-archive
- extendedWaitUntil:
    visible:
      id: archive-dialog
    timeout: 10000
- tapOn:
    id: archive-dialog-confirm
- extendedWaitUntil:
    visible:
      id: menu-feedback
    timeout: 15000
- assertVisible: 'Archived E2E Basbousa'
- assertNotVisible:
    id: item-${output.control.itemId}
- runScript:
    file: ../../scripts/control.js
    env:
      ACTION: menu/assert-archived

# The category is empty again, so it can be deleted.
- tapOn:
    id: category-${output.control.categoryId}-delete
- tapOn:
    id: category-delete-dialog-confirm
- extendedWaitUntil:
    visible:
      id: menu-feedback
    timeout: 15000
- assertVisible: 'Deleted the E2E Desserts category'
- assertNotVisible:
    id: menu-section-${output.control.categoryId}
